<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>멜론 Top 10 · 오늘의 차트</title>
<meta name="description" content="멜론 Top 100 차트를 FastAPI로 가공하고 Gemini로 요약한 결과를 보여주는 페이지">
<link rel="stylesheet" href="css/style.css?v=5">
</head>
<body>
<main class="wrap">
  <header>
    <p class="eyebrow">Melon Chart × FastAPI × Gemini</p>
    <h1>오늘의 멜론 Top 10</h1>
    <p class="sub">사이트 주인의 컴퓨터에서 실행 중인 FastAPI 서버에서 실시간으로 불러옵니다. <span id="updated"></span></p>
  </header>

  <section class="card" aria-labelledby="insight-title">
    <h2 id="insight-title">오늘의 차트 한 줄 평</h2>
    <div id="insight" class="status loading" role="status">
      <span class="spinner" aria-hidden="true"></span> Gemini가 차트를 분석하는 중…
    </div>
  </section>

  <section class="card" aria-labelledby="top10-title">
    <h2 id="top10-title">Top 10</h2>
    <div id="top10-status" class="status loading" role="status">
      <span class="spinner" aria-hidden="true"></span> 차트를 불러오는 중…
    </div>
    <ol id="top10" class="songs" hidden></ol>
  </section>

  <section class="card" aria-labelledby="artists-title">
    <h2 id="artists-title">가수별 곡 수</h2>
    <div id="artists-status" class="status loading" role="status">
      <span class="spinner" aria-hidden="true"></span> 가수별 곡 수를 불러오는 중…
    </div>
    <ul id="artists" class="artists" hidden></ul>
    <p id="artists-more" class="more" hidden></p>
  </section>

  <footer>
    API: <a href="songs/">/songs</a> · <a href="songs/top10/">/songs/top10</a> ·
    <a href="artists/">/artists</a> · <a href="insight/">/insight</a> · 문서: <a href="docs/">/docs</a>
  </footer>
</main>
<script src="js/app.js?v=5"></script>
</body>
</html>
