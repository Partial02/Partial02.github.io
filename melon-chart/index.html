<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>멜론 Top 10 · 오늘의 차트</title>
<meta name="description" content="로컬 FastAPI 서버(localhost:8000)에서 멜론 Top 10과 Gemini 차트 한 줄 평을 불러오는 페이지">
<link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>
<main class="wrap">
  <header>
    <p class="eyebrow">Melon Chart × FastAPI × Gemini</p>
    <h1>오늘의 멜론 Top 10</h1>
    <p class="sub">내 컴퓨터에서 실행 중인 API(<code>http://127.0.0.1:8000</code>)에서 데이터를 불러옵니다.</p>
  </header>

  <section class="card" aria-labelledby="insight-title">
    <h2 id="insight-title">오늘의 차트 한 줄 평</h2>
    <div id="insight" class="status loading" role="status">
      <span class="spinner" aria-hidden="true"></span> Gemini가 차트를 분석하는 중…
    </div>
  </section>

  <section class="card" aria-labelledby="top10-title">
    <h2 id="top10-title">Top 10</h2>
    <div id="top10-status" class="status loading" role="status">
      <span class="spinner" aria-hidden="true"></span> 차트를 불러오는 중…
    </div>
    <ol id="top10" class="songs" hidden></ol>
  </section>

  <footer>
    API 서버 실행: <code>uvicorn main:app --reload</code> · 문서: <a href="http://127.0.0.1:8000/docs" target="_blank" rel="noopener">127.0.0.1:8000/docs</a>
  </footer>
</main>
<script src="js/app.js?v=2"></script>
</body>
</html>
